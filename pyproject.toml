[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-team-gym"
version = "0.2.0"
description = "Multi-agent benchmark for evaluating topology-aware LLM teams across strategy games"
authors = [
    { name = "Yogev Attias" },
]
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.1.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0",
    "anthropic>=0.20",
    "requests>=2.28",
]
analysis = [
    "matplotlib>=3.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
llm-team-gym = "llm_team_gym.main:main"
